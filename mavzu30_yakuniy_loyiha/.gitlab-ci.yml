# GitLab CI muqobili (GitHub Actions o'rniga). Bosqichlar: lint → test → build → scan → deploy
stages: [lint, test, build, scan, deploy]

variables:
  REGISTRY: $CI_REGISTRY_IMAGE
  TAG: $CI_COMMIT_SHORT_SHA
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

.python:
  image: python:3.12-slim
  cache: { paths: [.cache/pip] }
  before_script: [pip install -r requirements-dev.txt]

lint:
  extends: .python
  stage: lint
  script: [ruff check .]

test:
  extends: .python
  stage: test
  script:
    - pytest tests -q --junitxml=reports/junit.xml --cov=libs --cov=services --cov=web --cov-report=xml:reports/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
      coverage_report: { coverage_format: cobertura, path: reports/coverage.xml }

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export TAG=${CI_COMMIT_TAG#v}; [ -z "$TAG" ] && export TAG=sha-$CI_COMMIT_SHORT_SHA
    - export GIT_SHA=$CI_COMMIT_SHA BUILD_DATE=$(date -u +%FT%TZ)
    - docker compose -f docker-compose.yml build
    - docker compose -f docker-compose.yml push car-service customer-service sales-service financing-service notification-worker web
    - echo "TAG=$TAG" > build.env
  artifacts: { reports: { dotenv: build.env } }

scan:
  stage: scan
  image: { name: aquasec/trivy:latest, entrypoint: [""] }
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG
  script:
    - for s in car-service customer-service sales-service financing-service notification-worker web; do
        trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "$REGISTRY/$s:$TAG"; done

.deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s) && echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - scp -r docker-compose.yml docker-compose.prod.yml gateway scripts deploy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && REGISTRY=$REGISTRY bash deploy/deploy.sh $TAG"

deploy_staging:
  extends: .deploy
  environment: { name: staging, url: $STAGING_URL }
  rules: [{ if: $CI_COMMIT_BRANCH == "main" }]

deploy_production:
  extends: .deploy
  environment: { name: production, url: $PRODUCTION_URL }
  rules: [{ if: $CI_COMMIT_TAG, when: manual }]      # qo'lda tasdiqlash
