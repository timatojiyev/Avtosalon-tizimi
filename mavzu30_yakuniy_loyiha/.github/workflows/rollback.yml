# Qo'lda rollback: Actions → Rollback → "Run workflow" → muhit va oldingi versiya tegini kiriting.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Muhit"
        type: choice
        options: [staging, production]
        required: true
      version:
        description: "Qaytariladigan versiya (masalan: 1.2.0 yoki sha-1a2b3c4). Bo'sh — oldingi muvaffaqiyatli versiya"
        required: false

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/avtosalon' }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Rollback
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd $DEPLOY_PATH && bash deploy/rollback.sh ${{ inputs.version }}"
