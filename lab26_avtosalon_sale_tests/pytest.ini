[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: tez, izolyatsiyalangan testlar (domen, servis)
    integration: Flask ilova bilan HTTP testlar
    e2e: to'liq foydalanuvchi jarayoni
    slow: sekin testlar
