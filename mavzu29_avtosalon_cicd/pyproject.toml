[project]
name = "avtosalon"
version = "1.0.0"
description = "Avtosalon Tizimi — mikroservislar (CI/CD namunasi)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B006"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["libs", "services", "web"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
