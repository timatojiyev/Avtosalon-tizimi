# =====================================================================
#  API Gateway (nginx) — tizimga yagona kirish nuqtasi (:80)
#    /                  → web (boshqaruv paneli)
#    /api/cars/...      → car-service        /api/customers/... → customer-service
#    /api/sales/...     → sales-service      /api/financing/... → financing-service
#    /api/notifications → notification-worker
#  Docker DNS (127.0.0.11) har 10 s qayta so'raladi — `--scale` bilan ko'paytirilgan nusxalar
#  orasida so'rovlar navbat bilan (round-robin) taqsimlanadi.
# =====================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s '
                  'upstream=$upstream_addr rid=$request_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  sendfile on;
  gzip on;
  gzip_types application/json text/css application/javascript;
  client_max_body_size 1m;
  server_tokens off;

  # Rate limiting: bitta IP'dan sekundiga 20 so'rov (burst 40)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  map $http_x_request_id $rid { default $http_x_request_id; "" $request_id; }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $rid;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header X-Request-ID $rid always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # O'zgaruvchi orqali proxy_pass — nginx DNS'ni har safar yangidan hal qiladi (scale uchun)
    set $car        http://car-service:8000;
    set $customer   http://customer-service:8000;
    set $sales      http://sales-service:8000;
    set $financing  http://financing-service:8000;
    set $notifier   http://notification-worker:8000;
    set $web        http://web:8000;

    location = /gateway/health { access_log off; default_type application/json; return 200 '{"gateway":"ok"}'; }

    location /api/cars          { limit_req zone=api burst=40 nodelay; rewrite ^/api(/.*)$ $1 break; proxy_pass $car; }
    location /api/customers     { limit_req zone=api burst=40 nodelay; rewrite ^/api(/.*)$ $1 break; proxy_pass $customer; }
    location /api/sales         { limit_req zone=api burst=40 nodelay; rewrite ^/api(/.*)$ $1 break; proxy_pass $sales; }
    location /api/financing/    { limit_req zone=api burst=40 nodelay; rewrite ^/api/financing(/.*)$ $1 break; proxy_pass $financing; }
    location /api/notifications { rewrite ^/api(/.*)$ $1 break; proxy_pass $notifier; }

    # Servislarning health endpoint'lari: /api/health/car-service va h.k.
    location ~ ^/api/health/(car|customer|sales|financing)-service$ {
      set $svc $1-service;
      rewrite ^ /health break;
      proxy_pass http://$svc:8000;
    }

    location / { proxy_pass $web; }
  }
}
